<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mesa · Punto de venta</title>
<style>
  :root{
    --bg:#F4F6FB;
    --surface:#FFFFFF;
    --surface-alt:#F0F2F8;
    --surface-soft:#FFF4D9;
    --ink:#16213E;
    --ink-soft:#8A93AC;
    --ink-faint:#C9CEDD;
    --accent:#FFD666;
    --accent-strong:#F5BF3C;
    --accent-soft:#FFF0C2;
    --accent-ink:#16213E;
    --accent-2:#E1594C;
    --success:#33A873;
    --success-bg:#E7F7EF;
    --danger-bg:#FBEAE8;
    --border:#E8EBF2;
    --nav-bg:#FFFFFF;
    --nav-ink:#A2A9BC;
    --nav-active-bg:#FFD666;
    --radius-card:16px;
    --radius-btn:12px;
    --radius-chip:999px;
    --radius-sheet:24px;
    --shadow-card:0 2px 14px rgba(22,33,62,0.06);
    --shadow-sheet:0 -10px 30px rgba(22,33,62,0.16);
    --shadow-pop:0 10px 26px rgba(22,33,62,0.14);
    --mono: 'SFMono-Regular', ui-monospace, 'Courier New', Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  button, input, select{ font-family:inherit; }
  button{cursor:pointer;}
  :focus-visible{ outline:2px solid var(--accent-strong); outline-offset:2px; }
  svg{ display:block; }

  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px;
    background:var(--bg);
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-mark{
    width:42px; height:42px; border-radius:13px;
    background:var(--accent-strong);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(245,191,60,0.35);
  }
  .brand-mark svg{ width:21px; height:21px; }
  .brand-name{ font-size:21px; font-weight:800; letter-spacing:0.1px; color:var(--ink); }
  .topbar-clock{ font-family:var(--sans); font-weight:600; font-size:13px; color:var(--ink-soft); text-align:right; line-height:1.35; }

  /* ---------- Main view ---------- */
  .view{
    flex:1;
    overflow-y:auto;
    padding:6px 18px 110px;
  }
  .view::-webkit-scrollbar{ width:0; }

  h1.page-title{ font-size:24px; margin:6px 0 3px; font-weight:800; color:var(--ink); letter-spacing:-0.2px; }
  p.page-sub{ font-size:14px; color:var(--ink-soft); margin:0 0 20px; font-weight:500; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:sticky; bottom:0; z-index:20;
    display:flex;
    background:var(--nav-bg);
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -1px 0 var(--border), 0 -8px 24px rgba(22,33,62,0.05);
  }
  .navbtn{
    flex:1;
    background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 4px;
    color:var(--ink-soft);
    border-radius:14px;
    transition:background .15s ease, color .15s ease;
  }
  .navbtn .navicon{ width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
  .navbtn .navicon svg{ width:22px; height:22px; }
  .navbtn span:last-child{ font-size:11px; font-weight:700; letter-spacing:.1px; }
  .navbtn.active{ color:var(--ink); background:var(--nav-active-bg); }
  .navbtn:active{ transform:scale(0.95); }

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:18px;
    box-shadow:var(--shadow-card);
  }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:16px 16px 15px; box-shadow:var(--shadow-card); position:relative; overflow:hidden;
  }
  .stat-icon{
    width:36px; height:36px; border-radius:11px; background:var(--surface-soft);
    display:flex; align-items:center; justify-content:center; margin-bottom:10px;
  }
  .stat-icon svg{ width:18px; height:18px; }
  .stat-card .stat-label{ font-size:13px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; justify-content:space-between; }
  .stat-card .stat-value{ font-family:var(--sans); font-size:23px; font-weight:800; margin-top:6px; color:var(--ink); letter-spacing:-0.3px; }
  .stat-card.wide{ grid-column:1 / -1; }
  .stat-card.wide{ display:flex; align-items:center; justify-content:space-between; }
  .stat-card.wide .stat-icon{ margin-bottom:0; }
  .stat-card-row{ display:flex; align-items:center; gap:13px; }
  .stat-card-chev{ color:var(--ink-faint); }
  .stat-card-chev svg{ width:18px; height:18px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border:none; border-radius:var(--radius-btn);
    padding:14px 18px; font-size:15px; font-weight:700;
    background:var(--surface-alt); color:var(--ink);
  }
  .btn:active{ transform:scale(0.98); }
  .btn.primary{ background:var(--accent-strong); color:var(--accent-ink); }
  .btn.dark{ background:var(--ink); color:#fff; }
  .btn.danger{ background:var(--danger-bg); color:var(--accent-2); }
  .btn.block{ width:100%; }
  .btn.ghost{ background:transparent; border:1.5px solid var(--border); }
  .btn:disabled{ opacity:.45; }
  .btn svg{ width:16px; height:16px; }

  .cta-home{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg, #FFE29A, var(--accent-strong));
    color:var(--ink);
    border-radius:20px; padding:20px 20px; margin-bottom:20px;
    border:none; width:100%; text-align:left;
    box-shadow:0 10px 24px rgba(245,191,60,0.35);
  }
  .cta-home-left{ display:flex; align-items:center; gap:14px; }
  .cta-home-icon{
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.55);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cta-home-icon svg{ width:20px; height:20px; }
  .cta-home .cta-title{ font-size:17.5px; font-weight:800; }
  .cta-home .cta-sub{ font-size:12.5px; color:rgba(22,33,62,0.65); margin-top:2px; font-weight:600; }
  .cta-home .cta-arrow{ color:var(--ink); flex-shrink:0; }
  .cta-home .cta-arrow svg{ width:22px; height:22px; }

  .section-title{ font-size:15px; font-weight:800; color:var(--ink); margin:24px 0 12px; display:flex; align-items:center; gap:8px; }
  .section-title::before{ content:''; display:block; width:4px; height:16px; border-radius:3px; background:var(--accent-strong); }
  .section-title:first-child{ margin-top:0; }

  .empty-state{ text-align:center; padding:36px 20px 20px; color:var(--ink-soft); }
  .empty-illustration{ display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .empty-illustration svg{ width:132px; height:132px; }
  .empty-state .empty-title{ font-size:16px; font-weight:800; color:var(--ink); margin-bottom:5px;}
  .empty-state .empty-text{ font-size:13.5px; line-height:1.55; max-width:280px; margin:0 auto; }

  /* ---------- Category chips ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    border:1.5px solid var(--border); background:var(--surface);
    padding:10px 16px; border-radius:var(--radius-chip);
    font-size:13.5px; font-weight:700; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .chip.active{ color:var(--ink); border-color:transparent; }

  /* ---------- Product grid ---------- */
  .product-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .product-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:0; overflow:hidden; text-align:left; box-shadow:var(--shadow-card);
  }
  .product-card:active{ transform:scale(0.97); }
  .product-card .pc-top{ height:5px; }
  .product-card .pc-inner{ padding:14px 14px 15px; }
  .product-card .pc-emoji{ font-size:22px; }
  .product-card .pc-name{ font-size:13.5px; font-weight:700; margin:9px 0 7px; line-height:1.3; min-height:34px; color:var(--ink); }
  .product-card .pc-price{ font-family:var(--sans); font-size:15px; font-weight:800; color:var(--ink); }

  /* ---------- Cart mini bar ---------- */
  .cartbar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:84px; z-index:15;
    width:100%; max-width:528px; padding:0 18px;
  }
  .cartbar-inner{
    background:var(--ink); color:#fff; border-radius:18px;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 12px 26px rgba(22,33,62,0.35);
    border:none; width:100%;
  }
  .cartbar-count{
    background:var(--accent-strong); color:var(--accent-ink); font-size:12px; font-weight:800;
    border-radius:999px; width:23px; height:23px; display:inline-flex; align-items:center; justify-content:center;
    margin-right:9px;
  }
  .cartbar-total{ font-weight:800; }
  .cartbar-cta{ color:var(--accent-strong); font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:4px; }
  .cartbar-cta svg{ width:15px; height:15px; }

  /* ---------- Modal / sheet ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(16,22,42,0.45);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100; animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-sheet{
    background:var(--bg); width:100%; max-width:560px;
    max-height:92dvh; overflow-y:auto;
    border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
    box-shadow:var(--shadow-sheet);
    animation:slideUp .18s ease;
    padding:10px 20px 28px;
  }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet-grip{ width:38px; height:4px; background:var(--ink-faint); border-radius:99px; margin:8px auto 16px; }
  .modal-center{ align-items:center; }
  .modal-sheet.modal-card{ border-radius:var(--radius-sheet); margin:0 18px; max-height:88dvh; }

  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-header h2{ font-size:18px; margin:0; font-weight:800; color:var(--ink); }
  .sheet-close{ background:var(--surface-alt); border:none; width:32px; height:32px; border-radius:50%; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; }
  .sheet-close svg{ width:14px; height:14px; }

  /* ---------- Cart list ---------- */
  .cart-item{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
  .cart-item:last-child{ border-bottom:none; }
  .cart-item-info{ flex:1; min-width:0; }
  .cart-item-name{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .cart-item-price{ font-size:12px; color:var(--ink-soft); margin-top:2px; font-weight:600; }
  .qty-control{ display:flex; align-items:center; gap:8px; background:var(--surface-alt); border-radius:999px; padding:4px; }
  .qty-btn{ width:27px; height:27px; border-radius:50%; border:none; background:var(--surface); font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; color:var(--ink); box-shadow:0 1px 3px rgba(22,33,62,0.12); }
  .qty-val{ font-size:13.5px; font-weight:800; min-width:16px; text-align:center; color:var(--ink); }
  .cart-item-remove{ background:none; border:none; color:var(--accent-2); font-size:15px; padding:4px 2px; display:flex; }
  .cart-item-remove svg{ width:16px; height:16px; }
  .cart-item-subtotal{ font-size:13px; font-weight:800; width:58px; text-align:right; color:var(--ink); }

  .totals{ margin-top:16px; padding-top:12px; border-top:1px dashed var(--border); }
  .totals-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--ink-soft); font-weight:600; }
  .totals-row.grand{ color:var(--ink); font-size:18px; font-weight:800; padding-top:9px; }
  .totals-row .v{ font-weight:700; }

  /* ---------- Option groups (service/payment) ---------- */
  .opt-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-bottom:16px; }
  .opt-card{
    border:1.5px solid var(--border); background:var(--surface); border-radius:13px;
    padding:13px 6px; text-align:center; font-size:12.5px; font-weight:700; color:var(--ink-soft);
  }
  .opt-card .opt-emoji{ display:block; font-size:19px; margin-bottom:5px; }
  .opt-card.active{ border-color:var(--accent-strong); background:var(--accent-soft); color:var(--ink); }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .field input, .field select{
    width:100%; border:1.5px solid var(--border); border-radius:12px;
    padding:13px 14px; font-size:15px; background:var(--surface); color:var(--ink); font-weight:600;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent-strong); }
  .field-hint{ font-size:12px; margin-top:7px; font-weight:700; }
  .field-hint.ok{ color:var(--success); }
  .field-hint.warn{ color:var(--accent-2); }

  .switch{ display:flex; align-items:center; }
  .switch input{ display:none; }
  .switch .track{
    width:40px; height:24px; border-radius:99px; background:var(--border); position:relative; transition:background .15s;
  }
  .switch .track::after{
    content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch input:checked + .track{ background:var(--success); }
  .switch input:checked + .track::after{ left:18px; }

  /* ---------- History rows ---------- */
  .search-box{
    display:flex; align-items:center; gap:9px; background:var(--surface); border:1.5px solid var(--border);
    border-radius:13px; padding:12px 15px; margin-bottom:14px; box-shadow:var(--shadow-card);
  }
  .search-box svg{ width:17px; height:17px; color:var(--ink-soft); flex-shrink:0; }
  .search-box input{ border:none; outline:none; background:none; flex:1; font-size:14px; color:var(--ink); font-weight:500; }
  .filter-row{ display:flex; gap:8px; overflow-x:auto; margin-bottom:10px; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:0 0 auto; font-size:12px; font-weight:700; padding:8px 13px; border-radius:999px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft);
  }
  .filter-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .sale-row{
    display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-card); padding:14px 15px; margin-bottom:10px; text-align:left; width:100%;
    box-shadow:var(--shadow-card);
  }
  .sale-row.cancelled{ opacity:.55; }
  .sale-row-badge{
    width:42px; height:42px; border-radius:12px; background:var(--surface-soft); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
  }
  .sale-row-main{ flex:1; min-width:0; }
  .sale-row-num{ font-size:13.5px; font-weight:800; color:var(--ink); }
  .sale-row-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-weight:600; }
  .sale-row-right{ text-align:right; }
  .sale-row-total{ font-size:15px; font-weight:800; color:var(--ink); }
  .tag{ display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px; margin-top:4px; }
  .tag.cancel{ background:var(--danger-bg); color:var(--accent-2); }

  /* ---------- Ticket ---------- */
  .ticket{ font-family:var(--mono); background:var(--surface); border-radius:16px; padding:22px 18px; border:1.5px dashed var(--ink-faint); }
  .ticket-center{ text-align:center; }
  .ticket h3{ margin:0 0 2px; font-size:16px; letter-spacing:1px; color:var(--ink); }
  .ticket .ticket-sub{ font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
  .ticket hr{ border:none; border-top:1px dashed var(--ink-faint); margin:10px 0; }
  .ticket-line{ display:flex; justify-content:space-between; font-size:12.5px; margin:2px 0; color:var(--ink); }
  .ticket-item-row{ font-size:12.5px; margin:5px 0; }
  .ticket-item-row .ti-name{ display:flex; justify-content:space-between; color:var(--ink); }
  .ticket-item-qty{ color:var(--ink-soft); }
  .ticket-total{ font-size:15px; font-weight:700; }
  .ticket-meta{ font-size:11.5px; color:var(--ink-soft); margin:1px 0; }

  /* ---------- Products view ---------- */
  .prod-row{ display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:12px 13px; margin-bottom:9px; box-shadow:var(--shadow-card); }
  .prod-row .pr-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .prod-row .pr-info{ flex:1; min-width:0; }
  .prod-row .pr-name{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .prod-row .pr-price{ font-size:12px; color:var(--ink-soft); margin-top:2px; font-weight:600; }
  .icon-btn{ background:var(--surface-alt); border:none; width:32px; height:32px; border-radius:10px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; }
  .icon-btn svg{ width:14px; height:14px; }
  .cat-header{ display:flex; align-items:center; gap:8px; margin:22px 0 11px; }
  .cat-header:first-child{ margin-top:0; }
  .cat-header .cat-emoji{ font-size:16px; }
  .cat-header .cat-name{ font-size:14.5px; font-weight:800; color:var(--ink); }
  .cat-header .cat-count{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }

  .fab-row{ display:flex; justify-content:flex-end; margin-bottom:6px; }

  /* ---------- Bars for stats ---------- */
  .bar-row{ margin-bottom:13px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-row-top{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--ink); }
  .bar-row-top .bv{ color:var(--ink-soft); font-weight:600; }
  .bar-track{ height:9px; background:var(--surface-alt); border-radius:999px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; }

  .top-product-row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--border); }
  .top-product-row:last-child{ border-bottom:none; }
  .top-product-rank{ width:24px; height:24px; border-radius:8px; background:var(--surface-soft); font-size:11px; font-weight:800; color:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .top-product-name{ flex:1; font-size:13px; font-weight:700; color:var(--ink); }
  .top-product-qty{ font-size:11px; color:var(--ink-soft); font-weight:600; }
  .top-product-rev{ font-size:13px; font-weight:800; color:var(--ink); }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:150px; transform:translate(-50%, 12px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:700;
    padding:12px 20px; border-radius:999px; z-index:200; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; max-width:80%; text-align:center;
    box-shadow:0 10px 24px rgba(22,33,62,0.3);
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  .no-print{}
  @media print{
    body *{ visibility:hidden; }
    #ticket-print, #ticket-print *{ visibility:visible; }
    #ticket-print{ position:absolute; top:0; left:0; width:100%; padding:0; }
    .no-print{ display:none !important; }
  }

  @media (min-width:640px){
    .product-grid{ grid-template-columns:1fr 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-name">Mesa</span>
    </div>
    <div class="topbar-clock" id="clock"></div>
  </header>

  <main class="view" id="view"></main>

  <nav class="bottomnav no-print">
    <button class="navbtn" data-view="home" data-icon="home" onclick="goTo('home')"><span class="navicon"></span><span>Inicio</span></button>

/* ---------- Helpers ---------- */
function formatMoney(n){
  n = round2(n);
  return '$' + n.toLocaleString('es-MX', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function formatDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('es-MX', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function formatDateShort(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX', { day:'2-digit', month:'short' });
}
function findProduct(id){ return DB.getProducts().find(p => p.id === id); }
function categoryOf(id){ return CATEGORIES.find(c => c.id === id) || CATEGORIES[0]; }
function serviceOf(id){ return SERVICE_TYPES.find(s => s.id === id) || SERVICE_TYPES[0]; }
function paymentOf(id){ return PAYMENT_METHODS.find(p => p.id === id) || PAYMENT_METHODS[0]; }
function orderNumberLabel(n){ return '#' + String(n).padStart(4,'0'); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function startOfWeek(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // lunes=0
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() - day);
  return date;
}
function isSameWeek(a,b){ return startOfWeek(a).getTime() === startOfWeek(b).getTime(); }
function isSameMonth(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth(); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- Navegación ---------- */
function goTo(view){
  currentView = view;
  render();
  document.getElementById('view').scrollTop = 0;
}

function render(){
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  const el = document.getElementById('view');
  if(currentView === 'home') el.innerHTML = renderHome();
  else if(currentView === 'sale') el.innerHTML = renderSale();
  else if(currentView === 'history'){ el.innerHTML = renderHistoryShell(); renderHistoryList(); }
  else if(currentView === 'stats') el.innerHTML = renderStats();
  else if(currentView === 'products') el.innerHTML = renderProducts();
}

/* =========================================================

========================================================= */
function renderHome(){
  const sales = DB.getSales().filter(s => !s.cancelled);
  const now = new Date();
  const today = sales.filter(s => isSameDay(new Date(s.date), now));
  const totalHoy = today.reduce((a,s)=>a+s.total,0);
  const pedidosHoy = today.length;
  const ticketProm = pedidosHoy ? totalHoy/pedidosHoy : 0;

  const recientes = DB.getSales().slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,3);

  const saludo = now.getHours() < 12 ? 'Buenos días' : (now.getHours() < 19 ? 'Buenas tardes' : 'Buenas noches');

  return `
    <h1 class="page-title">${saludo}</h1>
    <p class="page-sub">${now.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' })}</p>

    <button class="cta-home" onclick="goTo('sale')">
      <div class="cta-home-left">
        <div class="cta-home-icon">${icon('plus')}</div>
        <div>
          <div class="cta-title">Nueva venta</div>
          <div class="cta-sub">Tomar un pedido y cobrar</div>
        </div>
      </div>
      <div class="cta-arrow">${icon('arrowRight')}</div>
    </button>

    <div class="section-title">Hoy</div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon">${icon('document')}</div>
        <div class="stat-label">Ventas de hoy<span class="stat-card-chev">${icon('chevronRight')}</span></div>
        <div class="stat-value">${formatMoney(totalHoy)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">${icon('box')}</div>
        <div class="stat-label">Pedidos de hoy<span class="stat-card-chev">${icon('chevronRight')}</span></div>
        <div class="stat-value">${pedidosHoy}</div>
      </div>
      <div class="stat-card wide">
        <div class="stat-card-row">
          <div class="stat-icon">${icon('ticket')}</div>
          <div>
            <div class="stat-label">Ticket promedio de hoy</div>
            <div class="stat-value">${formatMoney(ticketProm)}</div>
          </div>
        </div>
        <span class="stat-card-chev">${icon('chevronRight')}</span>
      </div>
    </div>

    <div class="section-title">Actividad reciente</div>
    ${recientes.length === 0 ? `
      <div class="empty-state">
        ${illustration('receiptEmpty')}
        <div class="empty-title">Aún no hay ventas</div>
        <div class="empty-text">Cuando registres tu primera venta, aparecerá aquí.</div>
      </div>
    ` : recientes.map(s => renderSaleRow(s)).join('')}
  `;
}

========================================================= */
function renderSale(){
  const products = DB.getProducts().filter(p => p.active);
  const list = saleCategoryFilter === 'todos' ? products : products.filter(p => p.category === saleCategoryFilter);

  const chips = `<div class="chip-row">
      <button class="chip ${saleCategoryFilter==='todos'?'active':''}" style="${saleCategoryFilter==='todos'?'background:var(--accent-strong)':''}" onclick="setSaleCategory('todos')">Todos</button>
      ${CATEGORIES.map(c => `
        <button class="chip ${saleCategoryFilter===c.id?'active':''}" style="${saleCategoryFilter===c.id?'background:var(--accent-strong)':''}" onclick="setSaleCategory('${c.id}')">${c.emoji} ${c.name}</button>
      `).join('')}
    </div>`;

  const grid = list.length === 0 ? `
      <div class="empty-state">
        ${illustration('boxEmpty')}
        <div class="empty-title">Sin productos aquí</div>
        <div class="empty-text">No hay productos activos en esta categoría.</div>
      </div>
    ` : `<div class="product-grid">
      ${list.map(p => {
        const cat = categoryOf(p.category);
        return `<button class="product-card" onclick="addToCart('${p.id}')">
          <div class="pc-top" style="background:${cat.color}"></div>
          <div class="pc-inner">
            <span class="pc-emoji">${cat.emoji}</span>
            <div class="pc-name">${escapeHtml(p.name)}</div>
            <div class="pc-price">${formatMoney(p.price)}</div>
          </div>
        </button>`;
      }).join('')}
    </div>`;

  const cartCount = cart.reduce((a,c)=>a+c.qty,0);
  const totals = computeTotals();

  return `
    <h1 class="page-title">Nueva venta</h1>
    <p class="page-sub">Toca un producto para agregarlo al pedido</p>
    ${chips}
    ${grid}
    ${cartCount > 0 ? `
      <div class="cartbar no-print">
        <button class="cartbar-inner" onclick="openCartSheet('cart')">
          <span><span class="cartbar-count">${cartCount}</span>Ver carrito</span>
          <span class="cartbar-total">${formatMoney(totals.total)}</span>
        </button>
      </div>
    ` : ''}
  `;
}

function setSaleCategory(id){ saleCategoryFilter = id; render(); }

function addToCart(productId){
  const item = cart.find(c => c.productId === productId);
  if(item){ item.qty += 1; } else { cart.push({ productId, qty:1 }); }
  toast('Agregado al carrito');
  render();
}

function computeTotals(){
  const subtotal = cart.reduce((a,c) => {
    const p = findProduct(c.productId);
    return a + (p ? p.price * c.qty : 0);
  }, 0);
  const iva = subtotal * IVA_RATE;
  const total = subtotal + iva;
  return { subtotal: round2(subtotal), iva: round2(iva), total: round2(total) };
}

/* ---------- Carrito / checkout (modal) ---------- */
function openModal(html, opts){
  opts = opts || {};
  const layer = document.getElementById('modal-layer');
  layer.innerHTML = `<div class="modal-overlay ${opts.center?'modal-center':''}" id="modalOverlay">
      <div class="modal-sheet ${opts.card?'modal-card':''}">
        ${opts.grip !== false ? '<div class="sheet-grip"></div>' : ''}
        ${html}
      </div>
    </div>`;
  if(opts.dismissible !== false){
    document.getElementById('modalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'modalOverlay') closeModal();
    });
  }
}
function closeModal(){ document.getElementById('modal-layer').innerHTML = ''; }

function openCartSheet(step){
  if(cart.length === 0 && step !== 'cart'){ step = 'cart'; }
  openModal(cartSheetHTML(step), { dismissible:true });
}

function cartSheetHTML(step){
  const totals = computeTotals();
  if(step === 'checkout'){
    const cashNum = parseFloat(checkout.cash) || 0;
    const change = cashNum - totals.total;
    return `
      <div class="sheet-header">
        <h2>Cobrar pedido</h2>
        <button class="sheet-close" onclick="closeModal()">${icon('close')}</button>
      </div>

      <div class="section-title" style="margin-top:0;">Tipo de servicio</div>
      <div class="opt-grid">
        ${SERVICE_TYPES.map(s => `
          <button class="opt-card ${checkout.serviceType===s.id?'active':''}" onclick="setServiceType('${s.id}')">
            <span class="opt-emoji">${s.emoji}</span>${s.name}
          </button>
        `).join('')}
      </div>
      ${checkout.serviceType === 'comer' ? `
        <div class="field">
          <label>Número de mesa (opcional)</label>
          <input type="text" inputmode="numeric" placeholder="Ej. 5" value="${escapeHtml(checkout.table)}" oninput="checkout.table=this.value">
        </div>
      ` : ''}

      <div class="section-title">Método de pago</div>
      <div class="opt-grid">
        ${PAYMENT_METHODS.map(p => `
          <button class="opt-card ${checkout.paymentMethod===p.id?'active':''}" onclick="setPaymentMethod('${p.id}')">
            <span class="opt-emoji">${p.emoji}</span>${p.name}
          </button>
        `).join('')}
      </div>
      ${checkout.paymentMethod === 'efectivo' ? `
        <div class="field">
          <label>Efectivo recibido</label>
          <input id="cashInput" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0.00" value="${escapeHtml(checkout.cash)}" oninput="onCashInput(this.value)">
          <div class="field-hint ${cashNum >= totals.total ? 'ok' : 'warn'}" id="cashHint">
            ${cashNum > 0 ? (cashNum >= totals.total ? 'Cambio: ' + formatMoney(change) : 'Falta ' + formatMoney(totals.total - cashNum)) : 'Ingresa el monto entregado por el cliente'}
          </div>
        </div>
      ` : ''}

      <div class="totals">
        <div class="totals-row"><span>Subtotal</span><span class="v">${formatMoney(totals.subtotal)}</span></div>
        <div class="totals-row"><span>IVA (16%)</span><span class="v">${formatMoney(totals.iva)}</span></div>
        <div class="totals-row grand"><span>Total</span><span class="v">${formatMoney(totals.total)}</span></div>
      </div>

      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn ghost" onclick="openCartSheet('cart')">Volver</button>
        <button class="btn primary block" onclick="confirmarCobro()">Cobrar ${formatMoney(totals.total)}</button>
      </div>
    `;
  }

  // step === 'cart'
  return `
    <div class="sheet-header">
      <h2>Carrito</h2>
      <button class="sheet-close" onclick="closeModal()">${icon('close')}</button>
    </div>
    ${cart.length === 0 ? `
      <div class="empty-state">
        ${illustration('cartEmpty')}
        <div class="empty-title">Carrito vacío</div>
        <div class="empty-text">Agrega productos desde el catálogo.</div>
      </div>
    ` : cart.map(c => {
      const p = findProduct(c.productId);
      if(!p) return '';
      return `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${escapeHtml(p.name)}</div>
            <div class="cart-item-price">${formatMoney(p.price)} c/u</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty('${p.id}', -1)">−</button>
            <span class="qty-val">${c.qty}</span>
            <button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button>
          </div>
          <div class="cart-item-subtotal">${formatMoney(p.price * c.qty)}</div>
          <button class="cart-item-remove" onclick="removeFromCart('${p.id}')">${icon('trash')}</button>
        </div>
      `;
    }).join('')}
    ${cart.length > 0 ? `
      <div class="totals">
        <div class="totals-row"><span>Subtotal</span><span class="v">${formatMoney(totals.subtotal)}</span></div>
        <div class="totals-row"><span>IVA (16%)</span><span class="v">${formatMoney(totals.iva)}</span></div>
        <div class="totals-row grand"><span>Total</span><span class="v">${formatMoney(totals.total)}</span></div>
      </div>
      <button class="btn primary block" style="margin-top:16px;" onclick="openCartSheet('checkout')">Continuar</button>
    ` : ''}
  `;
}

function changeQty(productId, delta){
  const item = cart.find(c => c.productId === productId);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ cart = cart.filter(c => c.productId !== productId); }
  openCartSheet('cart');
  renderBackgroundIfSale();
}
function removeFromCart(productId){
  cart = cart.filter(c => c.productId !== productId);
  openCartSheet('cart');
  renderBackgroundIfSale();
}
function renderBackgroundIfSale(){ if(currentView === 'sale') render(); }

function setServiceType(id){ checkout.serviceType = id; openCartSheet('checkout'); }
function setPaymentMethod(id){ checkout.paymentMethod = id; openCartSheet('checkout'); }

function onCashInput(val){
  checkout.cash = val;
  const totals = computeTotals();
  const cashNum = parseFloat(val) || 0;
  const change = cashNum - totals.total;
  const hint = document.getElementById('cashHint');
  if(hint){
    hint.className = 'field-hint ' + (cashNum >= totals.total ? 'ok' : 'warn');
    hint.textContent = cashNum > 0 ? (cashNum >= totals.total ? 'Cambio: ' + formatMoney(change) : 'Falta ' + formatMoney(totals.total - cashNum)) : 'Ingresa el monto entregado por el cliente';
  }
}

function confirmarCobro(){
  if(cart.length === 0){ toast('El carrito está vacío'); return; }
  const totals = computeTotals();
  if(checkout.paymentMethod === 'efectivo'){
    const cashNum = parseFloat(checkout.cash) || 0;
    if(cashNum < totals.total){ toast('El efectivo recibido es insuficiente'); return; }
  }

  const number = DB.nextSaleNumber();
  const sale = {
    id: 'v' + Date.now(),
    number: number,
    date: new Date().toISOString(),
    items: cart.map(c => {
      const p = findProduct(c.productId);
      return { productId: p.id, name: p.name, price: p.price, qty: c.qty };
    }),
    subtotal: totals.subtotal,
    iva: totals.iva,
    total: totals.total,
    serviceType: checkout.serviceType,
    table: checkout.serviceType === 'comer' ? checkout.table : '',
    paymentMethod: checkout.paymentMethod,
    cash: checkout.paymentMethod === 'efectivo' ? (parseFloat(checkout.cash) || 0) : null,
    change: checkout.paymentMethod === 'efectivo' ? round2((parseFloat(checkout.cash) || 0) - totals.total) : null,
    cancelled: false
  };

  const sales = DB.getSales();
  sales.push(sale);
  DB.saveSales(sales);

  cart = [];
  checkout = { serviceType:'comer', table:'', paymentMethod:'efectivo', cash:'' };
  saleCategoryFilter = 'todos';

  showTicket(sale, { fromCheckout:true });
}

function renderHistoryShell(){
  return `
    <h1 class="page-title">Historial</h1>
    <p class="page-sub">Todas las ventas registradas</p>

    <div class="search-box">
      <span>${icon('search')}</span>

      <button class="filter-chip ${historyFilters.payment==='all'?'active':''}" onclick="setHistoryFilter('payment','all')">Todo pago</button>

    </div>

    <div id="historyList"></div>
  `;

function matchesHistoryFilters(sale){
  const now = new Date();
  const d = new Date(sale.date);
  if(historyFilters.period === 'today' && !isSameDay(d, now)) return false;
  if(historyFilters.period === 'week' && !isSameWeek(d, now)) return false;
  if(historyFilters.period === 'month' && !isSameMonth(d, now)) return false;
  if(historyFilters.status === 'activa' && sale.cancelled) return false;
  if(historyFilters.status === 'cancelada' && !sale.cancelled) return false;
  if(historyFilters.service !== 'all' && sale.serviceType !== historyFilters.service) return false;
  if(historyFilters.payment !== 'all' && sale.paymentMethod !== historyFilters.payment) return false;
  if(historyFilters.search){
    const q = historyFilters.search.toLowerCase();
    const inNumber = String(sale.number).includes(q) || orderNumberLabel(sale.number).toLowerCase().includes(q);
    const inItems = sale.items.some(it => it.name.toLowerCase().includes(q));
    const inTable = (sale.table || '').toLowerCase().includes(q);
    if(!inNumber && !inItems && !inTable) return false;
  }
  return true;
}

function renderHistoryList(){
  const container = document.getElementById('historyList');
  if(!container) return;
  const allSales = DB.getSales();
  const sales = allSales.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).filter(matchesHistoryFilters);
  container.innerHTML = sales.length === 0 ? (
    allSales.length === 0 ? `
      <div class="empty-state">
        ${illustration('docsEmpty')}
        <div class="empty-title">Aún no hay historial</div>
        <div class="empty-text">Cuando registres tu primera venta, aparecerá aquí.</div>
      </div>
    ` : `
      <div class="empty-state">
        ${illustration('searchEmpty')}
        <div class="empty-title">Sin resultados</div>
        <div class="empty-text">No hay ventas que coincidan con estos filtros.</div>
      </div>
    `
  ) : sales.map(s => renderSaleRow(s)).join('');
}

function onHistorySearch(val){ historyFilters.search = val; renderHistoryList(); }
function setHistoryFilter(key, val){
  historyFilters[key] = val;
  render();
}

function openSaleDetail(saleId){
  const sale = DB.getSales().find(s => s.id === saleId);
  if(!sale) return;
  const html = `
    <div class="sheet-header no-print">
      <h2>Detalle de venta</h2>
      <button class="sheet-close" onclick="closeModal()">${icon('close')}</button>
    </div>
    <div id="ticket-print">${ticketHTML(sale)}</div>
    <div style="display:flex; gap:10px; margin-top:16px;" class="no-print">
      <button class="btn ghost" onclick="window.print()">${icon('print')} Imprimir</button>
      ${!sale.cancelled ? `<button class="btn danger block" onclick="cancelSale('${sale.id}')">Cancelar venta</button>` : `<button class="btn dark block" onclick="closeModal()">Cerrar</button>`}
    </div>
  `;
  openModal(html, { dismissible:true });
}

function cancelSale(saleId){
  const ok = window.confirm('¿Cancelar esta venta? Se mantendrá en el historial pero dejará de contar en las estadísticas.');
  if(!ok) return;
  const sales = DB.getSales();
  const sale = sales.find(s => s.id === saleId);
  if(!sale) return;
  sale.cancelled = true;
  DB.saveSales(sales);
  toast('Venta cancelada');
  closeModal();
  render();
}

/* =========================================================
   VISTA: VENTAS (dashboard)
========================================================= */
function renderStats(){
  const all = DB.getSales();
  const active = all.filter(s => !s.cancelled);
  const now = new Date();

  const hoy = active.filter(s => isSameDay(new Date(s.date), now));
  const semana = active.filter(s => isSameWeek(new Date(s.date), now));
  const mes = active.filter(s => isSameMonth(new Date(s.date), now));

  const sum = arr => arr.reduce((a,s)=>a+s.total,0);
  const ticketProm = active.length ? sum(active)/active.length : 0;

  if(active.length === 0){
    return `
      <h1 class="page-title">Ventas</h1>
      <p class="page-sub">Estadísticas del negocio</p>
      <div class="empty-state">
        ${illustration('chartEmpty')}
        <div class="empty-title">Aún no hay ventas registradas</div>
        <div class="empty-text">Cuando cobres tu primer pedido, verás aquí las estadísticas reales.</div>
      </div>
    `;
  }

  // Por método de pago
  const byPayment = {};
  PAYMENT_METHODS.forEach(p => byPayment[p.id] = { total:0, count:0 });
  active.forEach(s => { byPayment[s.paymentMethod].total += s.total; byPayment[s.paymentMethod].count += 1; });
  const maxPayment = Math.max(1, ...Object.values(byPayment).map(v=>v.total));

  // Por tipo de servicio
  const byService = {};
  SERVICE_TYPES.forEach(s => byService[s.id] = { total:0, count:0 });
  active.forEach(s => { byService[s.serviceType].total += s.total; byService[s.serviceType].count += 1; });
  const maxService = Math.max(1, ...Object.values(byService).map(v=>v.total));

  // Productos más vendidos
  const productMap = {};
  active.forEach(s => s.items.forEach(it => {
    if(!productMap[it.productId]) productMap[it.productId] = { name: it.name, qty:0, revenue:0 };
    productMap[it.productId].qty += it.qty;
    productMap[it.productId].revenue += it.price * it.qty;
  }));
  const topProducts = Object.values(productMap).sort((a,b)=>b.qty-a.qty).slice(0,5);

  return `
    <h1 class="page-title">Ventas</h1>
    <p class="page-sub">Estadísticas calculadas a partir de tus ventas reales</p>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Hoy</div>
        <div class="stat-value">${formatMoney(sum(hoy))}</div>
        <div class="stat-label" style="margin-top:4px;">${hoy.length} pedido${hoy.length===1?'':'s'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Esta semana</div>
        <div class="stat-value">${formatMoney(sum(semana))}</div>
        <div class="stat-label" style="margin-top:4px;">${semana.length} pedido${semana.length===1?'':'s'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Este mes</div>
        <div class="stat-value">${formatMoney(sum(mes))}</div>
        <div class="stat-label" style="margin-top:4px;">${mes.length} pedido${mes.length===1?'':'s'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ticket promedio</div>
        <div class="stat-value">${formatMoney(ticketProm)}</div>
        <div class="stat-label" style="margin-top:4px;">${active.length} pedidos en total</div>
      </div>
    </div>

    <div class="section-title">Ventas por método de pago</div>
    <div class="card">
      ${PAYMENT_METHODS.map(p => {
        const v = byPayment[p.id];
        return `<div class="bar-row">
          <div class="bar-row-top"><span>${p.emoji} ${p.name}</span><span class="bv">${formatMoney(v.total)} · ${v.count}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v.total/maxPayment)*100}%; background:var(--accent-strong);"></div></div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title">Ventas por tipo de servicio</div>
    <div class="card">
      ${SERVICE_TYPES.map(s => {
        const v = byService[s.id];
        return `<div class="bar-row">
          <div class="bar-row-top"><span>${s.emoji} ${s.name}</span><span class="bv">${formatMoney(v.total)} · ${v.count}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v.total/maxService)*100}%; background:var(--ink);"></div></div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title">Productos más vendidos</div>
    <div class="card">
      ${topProducts.map((p,i) => `
        <div class="top-product-row">
          <div class="top-product-rank">${i+1}</div>
          <div class="top-product-name">${escapeHtml(p.name)}<div class="top-product-qty">${p.qty} vendidos</div></div>
          <div class="top-product-rev">${formatMoney(p.revenue)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

/* =========================================================
   VISTA: PRODUCTOS
========================================================= */
function renderProducts(){
  const products = DB.getProducts();
  return `
    <h1 class="page-title">Productos</h1>
    <p class="page-sub">Administra tu catálogo</p>

    <div class="fab-row">
      <button class="btn primary" onclick="openProductForm()">${icon('plus')} Nuevo producto</button>
    </div>

    ${products.length === 0 ? `
      <div class="empty-state">
        ${illustration('boxEmpty')}
        <div class="empty-title">Aún no hay productos</div>
        <div class="empty-text">Agrega tu primer producto para empezar a vender.</div>
      </div>
    ` : ''}

    ${CATEGORIES.map(cat => {
      const items = products.filter(p => p.category === cat.id);
      if(items.length === 0) return '';
      return `
        <div class="cat-header">
          <span class="cat-emoji">${cat.emoji}</span>
          <span class="cat-name">${cat.name}</span>
          <span class="cat-count">· ${items.length}</span>
        </div>
        ${items.map(p => `
          <div class="prod-row">
            <span class="pr-dot" style="background:${cat.color}"></span>
            <div class="pr-info">
              <div class="pr-name">${escapeHtml(p.name)}</div>
              <div class="pr-price">${formatMoney(p.price)}</div>
            </div>
            <label class="switch">
              <input type="checkbox" ${p.active?'checked':''} onchange="toggleProductActive('${p.id}', this.checked)">
              <span class="track"></span>
            </label>
            <button class="icon-btn" onclick="openProductForm('${p.id}')">${icon('edit')}</button>
          </div>
        `).join('')}
      `;
    }).join('')}
  `;
}

function toggleProductActive(id, active){
  const products = DB.getProducts();
  const p = products.find(x => x.id === id);
  if(!p) return;
  p.active = active;
  DB.saveProducts(products);
  toast(active ? 'Producto activado' : 'Producto desactivado');
}

function openProductForm(productId){
  const products = DB.getProducts();
  const editing = productId ? products.find(p => p.id === productId) : null;
  const html = `
    <div class="sheet-header">
      <h2>${editing ? 'Editar producto' : 'Nuevo producto'}</h2>
      <button class="sheet-close" onclick="closeModal()">${icon('close')}</button>
    </div>
    <div class="field">
      <label>Nombre</label>
      <input id="pfName" type="text" placeholder="Ej. Hamburguesa Especial" value="${editing ? escapeHtml(editing.name) : ''}">
    </div>
    <div class="field">
      <label>Precio</label>
      <input id="pfPrice" type="number" min="0" step="0.5" placeholder="0.00" value="${editing ? editing.price : ''}">
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="pfCategory">
        ${CATEGORIES.map(c => `<option value="${c.id}" ${editing && editing.category===c.id ? 'selected':''}>${c.emoji} ${c.name}</option>`).join('')}
      </select>
    </div>
    <button class="btn primary block" onclick="saveProductForm('${editing ? editing.id : ''}')">${editing ? 'Guardar cambios' : 'Agregar producto'}</button>
  `;
  openModal(html, { dismissible:true });
}

function saveProductForm(productId){
  const name = document.getElementById('pfName').value.trim();
  const price = parseFloat(document.getElementById('pfPrice').value);
  const category = document.getElementById('pfCategory').value;

  if(!name){ toast('Escribe un nombre para el producto'); return; }
  if(isNaN(price) || price < 0){ toast('Ingresa un precio válido'); return; }

  const products = DB.getProducts();
  if(productId){
    const p = products.find(x => x.id === productId);
    p.name = name; p.price = round2(price); p.category = category;
  } else {
    products.push({ id:'p' + Date.now(), name, price: round2(price), category, active:true });
  }
  DB.saveProducts(products);
  closeModal();
  toast(productId ? 'Producto actualizado' : 'Producto agregado');
  render();
}

/* =========================================================
   Reloj + arranque
========================================================= */
function tickClock(){
  const el = document.getElementById('clock');
  if(!el) return;
  const now = new Date();
  el.innerHTML = now.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit' }) + '<br>' +
    now.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
}

function paintChrome(){
  const mark = document.getElementById('brandMark');
  if(mark) mark.innerHTML = ICONS.fork;
  document.querySelectorAll('.navbtn').forEach(btn => {
    const holder = btn.querySelector('.navicon');
    if(holder) holder.innerHTML = icon(btn.dataset.icon);
  });
}

initDB();
paintChrome();
render();
tickClock();
setInterval(tickClock, 30000);
</script>
</body>
</html>
