<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mesa · Punto de venta</title>
<style>
  :root{
    --bg:#FBF8F2;
    --surface:#FFFFFF;
    --surface-alt:#F1ECE0;
    --ink:#262220;
    --ink-soft:#7A7168;
    --ink-faint:#B3A996;
    --accent:#E8A33D;
    --accent-ink:#4A2E05;
    --accent-2:#C1443B;
    --success:#5B8C5A;
    --success-bg:#E9F2E8;
    --danger-bg:#F7E8E6;
    --border:#E7DFCD;
    --nav-bg:#23201B;
    --nav-ink:#C9C0AE;
    --radius-card:14px;
    --radius-btn:10px;
    --radius-chip:999px;
    --radius-sheet:22px;
    --shadow-sheet:0 -8px 30px rgba(35,32,27,0.25);
    --mono: 'Courier New', Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  button, input, select{ font-family:inherit; }
  button{cursor:pointer;}
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100dvh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-mark{
    width:34px; height:34px; border-radius:10px;
    background:var(--nav-bg);
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
  }
  .brand-name{ font-size:19px; font-weight:700; letter-spacing:0.2px; }
  .topbar-clock{ font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); text-align:right; line-height:1.3; }

  /* ---------- Main view ---------- */
  .view{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 100px;
  }
  .view::-webkit-scrollbar{ width:0; }

  h1.page-title{ font-size:21px; margin:2px 0 4px; font-weight:700; }
  p.page-sub{ font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:sticky; bottom:0; z-index:20;
    display:flex;
    background:var(--nav-bg);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .navbtn{
    flex:1;
    background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 2px;
    color:var(--nav-ink);
    border-radius:12px;
    transition:background .15s ease, color .15s ease;
  }
  .navbtn .navicon{ font-size:19px; }
  .navbtn span:last-child{ font-size:10.5px; font-weight:600; letter-spacing:.1px; }
  .navbtn.active{ color:var(--accent); background:rgba(232,163,61,0.12); }
  .navbtn:active{ transform:scale(0.95); }

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:16px;
  }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:14px 14px 12px;
  }
  .stat-card .stat-label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .stat-card .stat-value{ font-family:var(--mono); font-size:21px; font-weight:700; margin-top:4px; }
  .stat-card.wide{ grid-column:1 / -1; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:var(--radius-btn);
    padding:13px 18px; font-size:15px; font-weight:700;
    background:var(--surface-alt); color:var(--ink);
  }
  .btn:active{ transform:scale(0.98); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.dark{ background:var(--nav-bg); color:#fff; }
  .btn.danger{ background:var(--danger-bg); color:var(--accent-2); }
  .btn.block{ width:100%; }
  .btn.ghost{ background:transparent; border:1px solid var(--border); }
  .btn:disabled{ opacity:.45; }

  .cta-home{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--nav-bg); color:#fff;
    border-radius:18px; padding:18px 18px; margin-bottom:18px;
    border:none; width:100%; text-align:left;
  }
  .cta-home .cta-title{ font-size:16.5px; font-weight:700; }
  .cta-home .cta-sub{ font-size:12.5px; color:var(--nav-ink); margin-top:2px; }
  .cta-home .cta-arrow{ font-size:22px; color:var(--accent); }

  .section-title{ font-size:13px; font-weight:700; text-transform:none; color:var(--ink-soft); margin:22px 0 10px; }
  .section-title:first-child{ margin-top:0; }

  .empty-state{ text-align:center; padding:40px 16px; color:var(--ink-soft); }
  .empty-state .empty-emoji{ font-size:34px; display:block; margin-bottom:10px; }
  .empty-state .empty-title{ font-size:15px; font-weight:700; color:var(--ink); margin-bottom:4px;}
  .empty-state .empty-text{ font-size:13px; line-height:1.5; }

  /* ---------- Category chips ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    border:1px solid var(--border); background:var(--surface);
    padding:9px 15px; border-radius:var(--radius-chip);
    font-size:13.5px; font-weight:600; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .chip.active{ color:#fff; border-color:transparent; }

  /* ---------- Product grid ---------- */
  .product-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .product-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:0; overflow:hidden; text-align:left; border-left-width:5px; border-left-style:solid;
  }
  .product-card:active{ transform:scale(0.97); }
  .product-card .pc-inner{ padding:12px 12px 13px; }
  .product-card .pc-emoji{ font-size:22px; }
  .product-card .pc-name{ font-size:13.5px; font-weight:700; margin:8px 0 6px; line-height:1.25; min-height:34px; }
  .product-card .pc-price{ font-family:var(--mono); font-size:15px; font-weight:700; color:var(--ink); }

  /* ---------- Cart mini bar ---------- */
  .cartbar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:78px; z-index:15;
    width:100%; max-width:528px; padding:0 16px;
  }
  .cartbar-inner{
    background:var(--nav-bg); color:#fff; border-radius:16px;
    padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 10px 24px rgba(35,32,27,0.3);
    border:none; width:100%;
  }
  .cartbar-count{
    background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:700;
    border-radius:999px; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
    margin-right:8px;
  }
  .cartbar-total{ font-family:var(--mono); font-weight:700; }
  .cartbar-cta{ color:var(--accent); font-weight:700; font-size:13.5px; }

  /* ---------- Modal / sheet ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,17,14,0.5);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100; animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-sheet{
    background:var(--bg); width:100%; max-width:560px;
    max-height:92dvh; overflow-y:auto;
    border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
    box-shadow:var(--shadow-sheet);
    animation:slideUp .18s ease;
    padding:10px 18px 26px;
  }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet-grip{ width:38px; height:4px; background:var(--ink-faint); border-radius:99px; margin:6px auto 14px; }
  .modal-center{ align-items:center; }
  .modal-sheet.modal-card{ border-radius:var(--radius-sheet); margin:0 18px; max-height:88dvh; }

  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-header h2{ font-size:17px; margin:0; }
  .sheet-close{ background:var(--surface-alt); border:none; width:30px; height:30px; border-radius:50%; font-size:15px; color:var(--ink-soft); }

  /* ---------- Cart list ---------- */
  .cart-item{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .cart-item:last-child{ border-bottom:none; }
  .cart-item-info{ flex:1; min-width:0; }
  .cart-item-name{ font-size:13.5px; font-weight:700; }
  .cart-item-price{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .qty-control{ display:flex; align-items:center; gap:8px; background:var(--surface-alt); border-radius:999px; padding:4px; }
  .qty-btn{ width:26px; height:26px; border-radius:50%; border:none; background:var(--surface); font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .qty-val{ font-family:var(--mono); font-size:13.5px; font-weight:700; min-width:16px; text-align:center; }
  .cart-item-remove{ background:none; border:none; color:var(--accent-2); font-size:17px; padding:4px 2px; }
  .cart-item-subtotal{ font-family:var(--mono); font-size:13px; font-weight:700; width:56px; text-align:right; }

  .totals{ margin-top:14px; padding-top:10px; border-top:1px dashed var(--border); }
  .totals-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0; color:var(--ink-soft); }
  .totals-row.grand{ color:var(--ink); font-size:17px; font-weight:700; padding-top:8px; }
  .totals-row .v{ font-family:var(--mono); }

  /* ---------- Option groups (service/payment) ---------- */
  .opt-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; }
  .opt-card{
    border:1.5px solid var(--border); background:var(--surface); border-radius:12px;
    padding:12px 6px; text-align:center; font-size:12.5px; font-weight:700; color:var(--ink-soft);
  }
  .opt-card .opt-emoji{ display:block; font-size:19px; margin-bottom:5px; }
  .opt-card.active{ border-color:var(--accent); background:rgba(232,163,61,0.12); color:var(--accent-ink); }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select{
    width:100%; border:1.5px solid var(--border); border-radius:10px;
    padding:12px 13px; font-size:15px; background:var(--surface); color:var(--ink);
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); }
  .field-hint{ font-size:12px; margin-top:6px; font-weight:600; }
  .field-hint.ok{ color:var(--success); }
  .field-hint.warn{ color:var(--accent-2); }

  .switch{ display:flex; align-items:center; }
  .switch input{ display:none; }
  .switch .track{
    width:40px; height:24px; border-radius:99px; background:var(--border); position:relative; transition:background .15s;
  }
  .switch .track::after{
    content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch input:checked + .track{ background:var(--success); }
  .switch input:checked + .track::after{ left:18px; }

  /* ---------- History rows ---------- */
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--border);
    border-radius:12px; padding:11px 14px; margin-bottom:12px;
  }
  .search-box input{ border:none; outline:none; background:none; flex:1; font-size:14px; color:var(--ink); }
  .filter-row{ display:flex; gap:7px; overflow-x:auto; margin-bottom:16px; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:0 0 auto; font-size:12px; font-weight:700; padding:7px 12px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
  }
  .filter-chip.active{ background:var(--nav-bg); color:#fff; border-color:var(--nav-bg); }

  .sale-row{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-card); padding:13px 14px; margin-bottom:9px; text-align:left; width:100%;
  }
  .sale-row.cancelled{ opacity:.55; }
  .sale-row-badge{
    width:40px; height:40px; border-radius:11px; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
  }
  .sale-row-main{ flex:1; min-width:0; }
  .sale-row-num{ font-family:var(--mono); font-size:13px; font-weight:700; }
  .sale-row-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .sale-row-right{ text-align:right; }
  .sale-row-total{ font-family:var(--mono); font-size:14.5px; font-weight:700; }
  .tag{ display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; margin-top:3px; }
  .tag.cancel{ background:var(--danger-bg); color:var(--accent-2); }

  /* ---------- Ticket ---------- */
  .ticket{ font-family:var(--mono); background:var(--surface); border-radius:14px; padding:20px 18px; border:1px dashed var(--ink-faint); }
  .ticket-center{ text-align:center; }
  .ticket h3{ margin:0 0 2px; font-size:16px; letter-spacing:1px; }
  .ticket .ticket-sub{ font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
  .ticket hr{ border:none; border-top:1px dashed var(--ink-faint); margin:10px 0; }
  .ticket-line{ display:flex; justify-content:space-between; font-size:12.5px; margin:2px 0; }
  .ticket-item-row{ font-size:12.5px; margin:5px 0; }
  .ticket-item-row .ti-name{ display:flex; justify-content:space-between; }
  .ticket-item-qty{ color:var(--ink-soft); }
  .ticket-total{ font-size:15px; font-weight:700; }
  .ticket-meta{ font-size:11.5px; color:var(--ink-soft); margin:1px 0; }

  /* ---------- Products view ---------- */
  .prod-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px; }
  .prod-row .pr-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .prod-row .pr-info{ flex:1; min-width:0; }
  .prod-row .pr-name{ font-size:13.5px; font-weight:700; }
  .prod-row .pr-price{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .icon-btn{ background:var(--surface-alt); border:none; width:30px; height:30px; border-radius:9px; font-size:13px; }
  .cat-header{ display:flex; align-items:center; gap:8px; margin:20px 0 10px; }
  .cat-header:first-child{ margin-top:0; }
  .cat-header .cat-emoji{ font-size:16px; }
  .cat-header .cat-name{ font-size:14px; font-weight:700; }
  .cat-header .cat-count{ font-size:11.5px; color:var(--ink-soft); }

  .fab-row{ display:flex; justify-content:flex-end; margin-bottom:4px; }

  /* ---------- Bars for stats ---------- */
  .bar-row{ margin-bottom:12px; }
  .bar-row-top{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:5px; }
  .bar-row-top .bv{ font-family:var(--mono); color:var(--ink-soft); }
  .bar-track{ height:9px; background:var(--surface-alt); border-radius:999px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; }

  .top-product-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .top-product-row:last-child{ border-bottom:none; }
  .top-product-rank{ width:22px; height:22px; border-radius:7px; background:var(--surface-alt); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .top-product-name{ flex:1; font-size:13px; font-weight:700; }
  .top-product-qty{ font-size:11px; color:var(--ink-soft); }
  .top-product-rev{ font-family:var(--mono); font-size:13px; font-weight:700; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:150px; transform:translate(-50%, 12px);
    background:var(--nav-bg); color:#fff; font-size:13px; font-weight:600;
    padding:11px 18px; border-radius:999px; z-index:200; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; max-width:80%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  .no-print{}
  @media print{
    body *{ visibility:hidden; }
    #ticket-print, #ticket-print *{ visibility:visible; }
    #ticket-print{ position:absolute; top:0; left:0; width:100%; padding:0; }
    .no-print{ display:none !important; }
  }

  @media (min-width:640px){
    .product-grid{ grid-template-columns:1fr 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🍽️</span>
      <span class="brand-name">Mesa</span>
    </div>
    <div class="topbar-clock" id="clock"></div>
  </header>

  <main class="view" id="view"></main>

  <nav class="bottomnav no-print">
    <button class="navbtn" data-view="home" onclick="goTo('home')"><span class="navicon">🏠</span><span>Inicio</span></button>
    <button class="navbtn" data-view="sale" onclick="goTo('sale')"><span class="navicon">🛒</span><span>Nueva venta</span></button>
    <button class="navbtn" data-view="history" onclick="goTo('history')"><span class="navicon">🧾</span><span>Historial</span></button>
    <button class="navbtn" data-view="stats" onclick="goTo('stats')"><span class="navicon">📊</span><span>Ventas</span></button>
    <button class="navbtn" data-view="products" onclick="goTo('products')"><span class="navicon">🍔</span><span>Productos</span></button>
  </nav>
</div>

<div id="modal-layer"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   MESA — Prototipo funcional de POS para restaurante
   Un solo archivo. Datos persistidos en localStorage.
========================================================= */

const IVA_RATE = 0.16;

const CATEGORIES = [
  { id:'hamburguesas', name:'Hamburguesas', emoji:'🍔', color:'#C1443B' },
  { id:'tacos',        name:'Tacos',        emoji:'🌮', color:'#E8A33D' },
  { id:'complementos', name:'Complementos', emoji:'🍟', color:'#5B8C5A' },
  { id:'bebidas',      name:'Bebidas',      emoji:'🥤', color:'#3D7EA6' },
  { id:'postres',      name:'Postres',      emoji:'🍰', color:'#8B5FA3' },
];

const SERVICE_TYPES = [
  { id:'comer',     name:'Comer aquí',  emoji:'🍽️' },
  { id:'llevar',    name:'Para llevar', emoji:'🥡' },
  { id:'domicilio', name:'Domicilio',   emoji:'🛵' },
];

const PAYMENT_METHODS = [
  { id:'efectivo',      name:'Efectivo',      emoji:'💵' },
  { id:'tarjeta',       name:'Tarjeta',       emoji:'💳' },
  { id:'transferencia', name:'Transferencia', emoji:'📲' },
];

function defaultProducts(){
  return [
    { id:'p1',  name:'Hamburguesa Clásica',    price:89,  category:'hamburguesas', active:true },
    { id:'p2',  name:'Hamburguesa con Queso',  price:99,  category:'hamburguesas', active:true },
    { id:'p3',  name:'Hamburguesa Doble',      price:129, category:'hamburguesas', active:true },
    { id:'p4',  name:'Hamburguesa BBQ',        price:119, category:'hamburguesas', active:true },
    { id:'p5',  name:'Taco de Asada',          price:22,  category:'tacos', active:true },
    { id:'p6',  name:'Taco de Pastor',         price:20,  category:'tacos', active:true },
    { id:'p7',  name:'Taco de Bistec',         price:22,  category:'tacos', active:true },
    { id:'p8',  name:'Taco de Suadero',        price:20,  category:'tacos', active:true },
    { id:'p9',  name:'Papas a la Francesa',    price:45,  category:'complementos', active:true },
    { id:'p10', name:'Aros de Cebolla',        price:55,  category:'complementos', active:true },
    { id:'p11', name:'Ensalada César',         price:55,  category:'complementos', active:true },
    { id:'p12', name:'Nachos con Queso',       price:65,  category:'complementos', active:true },
    { id:'p13', name:'Refresco',               price:25,  category:'bebidas', active:true },
    { id:'p14', name:'Agua de Horchata',       price:30,  category:'bebidas', active:true },
    { id:'p15', name:'Limonada Natural',       price:28,  category:'bebidas', active:true },
    { id:'p16', name:'Café Americano',         price:25,  category:'bebidas', active:true },

/* ---------- Persistencia ---------- */
const DB = {
  getProducts(){ return JSON.parse(localStorage.getItem('mesa_products') || '[]'); },
  saveProducts(list){ localStorage.setItem('mesa_products', JSON.stringify(list)); },
  getSales(){ return JSON.parse(localStorage.getItem('mesa_sales') || '[]'); },
  saveSales(list){ localStorage.setItem('mesa_sales', JSON.stringify(list)); },
  nextSaleNumber(){
    let n = parseInt(localStorage.getItem('mesa_counter') || '0', 10) + 1;
    localStorage.setItem('mesa_counter', String(n));
    return n;
  }
};

function initDB(){
  if(localStorage.getItem('mesa_products') === null){ DB.saveProducts(defaultProducts()); }
  if(localStorage.getItem('mesa_sales') === null){ DB.saveSales([]); }
  if(localStorage.getItem('mesa_counter') === null){ localStorage.setItem('mesa_counter','0'); }
}

/* ---------- Estado en memoria ---------- */
let currentView = 'home';
let cart = [];               // { productId, qty }
let checkout = { serviceType:'comer', table:'', paymentMethod:'efectivo', cash:'' };
let saleCategoryFilter = 'todos';
let historyFilters = { search:'', period:'all', service:'all', payment:'all', status:'all' };

/* ---------- Helpers ---------- */
function formatMoney(n){
  n = round2(n);
  return '$' + n.toLocaleString('es-MX', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function formatDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('es-MX', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function formatDateShort(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-MX', { day:'2-digit', month:'short' });
}
function findProduct(id){ return DB.getProducts().find(p => p.id === id); }
function categoryOf(id){ return CATEGORIES.find(c => c.id === id) || CATEGORIES[0]; }
function serviceOf(id){ return SERVICE_TYPES.find(s => s.id === id) || SERVICE_TYPES[0]; }
function paymentOf(id){ return PAYMENT_METHODS.find(p => p.id === id) || PAYMENT_METHODS[0]; }
function orderNumberLabel(n){ return '#' + String(n).padStart(4,'0'); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function startOfWeek(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // lunes=0
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() - day);
  return date;
}
function isSameWeek(a,b){ return startOfWeek(a).getTime() === startOfWeek(b).getTime(); }
function isSameMonth(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth(); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ---------- Navegación ---------- */
function goTo(view){
  currentView = view;
  render();
  document.getElementById('view').scrollTop = 0;
}

function render(){
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  const el = document.getElementById('view');
  if(currentView === 'home') el.innerHTML = renderHome();
  else if(currentView === 'sale') el.innerHTML = renderSale();
  else if(currentView === 'history'){ el.innerHTML = renderHistoryShell(); renderHistoryList(); }
  else if(currentView === 'stats') el.innerHTML = renderStats();
  else if(currentView === 'products') el.innerHTML = renderProducts();
}

/* =========================================================
   VISTA: INICIO
========================================================= */
function renderHome(){
  const sales = DB.getSales().filter(s => !s.cancelled);
  const now = new Date();
  const today = sales.filter(s => isSameDay(new Date(s.date), now));
  const totalHoy = today.reduce((a,s)=>a+s.total,0);
  const pedidosHoy = today.length;
  const ticketProm = pedidosHoy ? totalHoy/pedidosHoy : 0;

  const recientes = DB.getSales().slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,3);

  const saludo = now.getHours() < 12 ? 'Buenos días' : (now.getHours() < 19 ? 'Buenas tardes' : 'Buenas noches');

  return `
    <h1 class="page-title">${saludo}</h1>
    <p class="page-sub">${now.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' })}</p>

    <button class="cta-home" onclick="goTo('sale')">
      <div>
        <div class="cta-title">+ Nueva venta</div>
        <div class="cta-sub">Tomar un pedido y cobrar</div>
      </div>
      <div class="cta-arrow">→</div>

    <div class="stat-grid">

        <div class="stat-value">${formatMoney(totalHoy)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pedidos de hoy</div>
        <div class="stat-value">${pedidosHoy}</div>
      </div>
      <div class="stat-card wide">
        <div class="stat-label">Ticket promedio de hoy</div>
        <div class="stat-value">${formatMoney(ticketProm)}</div>
      </div>
    </div>

    <div class="section-title">Actividad reciente</div>
    ${recientes.length === 0 ? `
      <div class="empty-state">
        <span class="empty-emoji">🧾</span>
        <div class="empty-title">Aún no hay ventas</div>

   VISTA: NUEVA VENTA
========================================================= */
function renderSale(){
  const products = DB.getProducts().filter(p => p.active);
  const list = saleCategoryFilter === 'todos' ? products : products.filter(p => p.category === saleCategoryFilter);

  const chips = `<div class="chip-row">
      <button class="chip ${saleCategoryFilter==='todos'?'active':''}" style="${saleCategoryFilter==='todos'?'background:'+'#23201B':''}" onclick="setSaleCategory('todos')">Todos</button>
      ${CATEGORIES.map(c => `
        <button class="chip ${saleCategoryFilter===c.id?'active':''}" style="${saleCategoryFilter===c.id?'background:'+c.color:''}" onclick="setSaleCategory('${c.id}')">${c.emoji} ${c.name}</button>
      `).join('')}
    </div>`;

  const grid = list.length === 0 ? `
      <div class="empty-state">
        <span class="empty-emoji">🍽️</span>
        <div class="empty-title">Sin productos aquí</div>
        <div class="empty-text">No hay productos activos en esta categoría.</div>
      </div>
    ` : `<div class="product-grid">
      ${list.map(p => {
        const cat = categoryOf(p.category);
        return `<button class="product-card" style="border-left-color:${cat.color}" onclick="addToCart('${p.id}')">
          <div class="pc-inner">
            <span class="pc-emoji">${cat.emoji}</span>
            <div class="pc-name">${escapeHtml(p.name)}</div>
            <div class="pc-price">${formatMoney(p.price)}</div>
          </div>
        </button>`;
      }).join('')}
    </div>`;

  const cartCount = cart.reduce((a,c)=>a+c.qty,0);
  const totals = computeTotals();

  return `
    <h1 class="page-title">Nueva venta</h1>
    <p class="page-sub">Toca un producto para agregarlo al pedido</p>
    ${chips}
    ${grid}
    ${cartCount > 0 ? `
      <div class="cartbar no-print">
        <button class="cartbar-inner" onclick="openCartSheet('cart')">
          <span><span class="cartbar-count">${cartCount}</span>Ver carrito</span>
          <span class="cartbar-total">${formatMoney(totals.total)}</span>
        </button>
      </div>
    ` : ''}
  `;
}

function setSaleCategory(id){ saleCategoryFilter = id; render(); }

function addToCart(productId){
  const item = cart.find(c => c.productId === productId);
  if(item){ item.qty += 1; } else { cart.push({ productId, qty:1 }); }
  toast('Agregado al carrito');
  render();
}

function computeTotals(){
  const subtotal = cart.reduce((a,c) => {
    const p = findProduct(c.productId);
    return a + (p ? p.price * c.qty : 0);
  }, 0);
  const iva = subtotal * IVA_RATE;
  const total = subtotal + iva;
  return { subtotal: round2(subtotal), iva: round2(iva), total: round2(total) };
}

/* ---------- Carrito / checkout (modal) ---------- */
function openModal(html, opts){
  opts = opts || {};
  const layer = document.getElementById('modal-layer');
  layer.innerHTML = `<div class="modal-overlay ${opts.center?'modal-center':''}" id="modalOverlay">
      <div class="modal-sheet ${opts.card?'modal-card':''}">
        ${opts.grip !== false ? '<div class="sheet-grip"></div>' : ''}
        ${html}
      </div>
    </div>`;
  if(opts.dismissible !== false){
    document.getElementById('modalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'modalOverlay') closeModal();
    });
  }
}
function closeModal(){ document.getElementById('modal-layer').innerHTML = ''; }

function openCartSheet(step){
  if(cart.length === 0 && step !== 'cart'){ step = 'cart'; }
  openModal(cartSheetHTML(step), { dismissible:true });
}

function cartSheetHTML(step){
  const totals = computeTotals();
  if(step === 'checkout'){
    const cashNum = parseFloat(checkout.cash) || 0;
    const change = cashNum - totals.total;
    return `
      <div class="sheet-header">
        <h2>Cobrar pedido</h2>
        <button class="sheet-close" onclick="closeModal()">✕</button>
      </div>

      <div class="section-title" style="margin-top:0;">Tipo de servicio</div>
      <div class="opt-grid">
        ${SERVICE_TYPES.map(s => `
          <button class="opt-card ${checkout.serviceType===s.id?'active':''}" onclick="setServiceType('${s.id}')">
            <span class="opt-emoji">${s.emoji}</span>${s.name}
          </button>
        `).join('')}
      </div>
      ${checkout.serviceType === 'comer' ? `
        <div class="field">
          <label>Número de mesa (opcional)</label>
          <input type="text" inputmode="numeric" placeholder="Ej. 5" value="${escapeHtml(checkout.table)}" oninput="checkout.table=this.value">
        </div>
      ` : ''}

      <div class="section-title">Método de pago</div>
      <div class="opt-grid">
        ${PAYMENT_METHODS.map(p => `
          <button class="opt-card ${checkout.paymentMethod===p.id?'active':''}" onclick="setPaymentMethod('${p.id}')">
            <span class="opt-emoji">${p.emoji}</span>${p.name}
          </button>
        `).join('')}
      </div>
      ${checkout.paymentMethod === 'efectivo' ? `
        <div class="field">
          <label>Efectivo recibido</label>
          <input id="cashInput" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0.00" value="${escapeHtml(checkout.cash)}" oninput="onCashInput(this.value)">
          <div class="field-hint ${cashNum >= totals.total ? 'ok' : 'warn'}" id="cashHint">
            ${cashNum > 0 ? (cashNum >= totals.total ? 'Cambio: ' + formatMoney(change) : 'Falta ' + formatMoney(totals.total - cashNum)) : 'Ingresa el monto entregado por el cliente'}
          </div>
        </div>
      ` : ''}

      <div class="totals">
        <div class="totals-row"><span>Subtotal</span><span class="v">${formatMoney(totals.subtotal)}</span></div>
        <div class="totals-row"><span>IVA (16%)</span><span class="v">${formatMoney(totals.iva)}</span></div>
        <div class="totals-row grand"><span>Total</span><span class="v">${formatMoney(totals.total)}</span></div>
      </div>

      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn ghost" onclick="openCartSheet('cart')">Volver</button>
        <button class="btn primary block" onclick="confirmarCobro()">Cobrar ${formatMoney(totals.total)}</button>
      </div>
    `;
  }

  // step === 'cart'
  return `
    <div class="sheet-header">
      <h2>Carrito</h2>
      <button class="sheet-close" onclick="closeModal()">✕</button>
    </div>
    ${cart.length === 0 ? `
      <div class="empty-state">
        <span class="empty-emoji">🛒</span>
        <div class="empty-title">Carrito vacío</div>
        <div class="empty-text">Agrega productos desde el catálogo.</div>
      </div>
    ` : cart.map(c => {
      const p = findProduct(c.productId);
      if(!p) return '';
      return `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${escapeHtml(p.name)}</div>
            <div class="cart-item-price">${formatMoney(p.price)} c/u</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty('${p.id}', -1)">−</button>
            <span class="qty-val">${c.qty}</span>
            <button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button>
          </div>
          <div class="cart-item-subtotal">${formatMoney(p.price * c.qty)}</div>
          <button class="cart-item-remove" onclick="removeFromCart('${p.id}')">✕</button>
        </div>
      `;
    }).join('')}
    ${cart.length > 0 ? `
      <div class="totals">
        <div class="totals-row"><span>Subtotal</span><span class="v">${formatMoney(totals.subtotal)}</span></div>
        <div class="totals-row"><span>IVA (16%)</span><span class="v">${formatMoney(totals.iva)}</span></div>
        <div class="totals-row grand"><span>Total</span><span class="v">${formatMoney(totals.total)}</span></div>
      </div>
      <button class="btn primary block" style="margin-top:16px;" onclick="openCartSheet('checkout')">Continuar</button>
    ` : ''}
  `;
}

function changeQty(productId, delta){
  const item = cart.find(c => c.productId === productId);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ cart = cart.filter(c => c.productId !== productId); }
  openCartSheet('cart');
  renderBackgroundIfSale();
}
function removeFromCart(productId){
  cart = cart.filter(c => c.productId !== productId);
  openCartSheet('cart');
  renderBackgroundIfSale();
}
function renderBackgroundIfSale(){ if(currentView === 'sale') render(); }

function setServiceType(id){ checkout.serviceType = id; openCartSheet('checkout'); }
function setPaymentMethod(id){ checkout.paymentMethod = id; openCartSheet('checkout'); }

function onCashInput(val){
  checkout.cash = val;
  const totals = computeTotals();
  const cashNum = parseFloat(val) || 0;
  const change = cashNum - totals.total;
  const hint = document.getElementById('cashHint');
  if(hint){
    hint.className = 'field-hint ' + (cashNum >= totals.total ? 'ok' : 'warn');
    hint.textContent = cashNum > 0 ? (cashNum >= totals.total ? 'Cambio: ' + formatMoney(change) : 'Falta ' + formatMoney(totals.total - cashNum)) : 'Ingresa el monto entregado por el cliente';
  }
}

function confirmarCobro(){
  if(cart.length === 0){ toast('El carrito está vacío'); return; }
  const totals = computeTotals();
  if(checkout.paymentMethod === 'efectivo'){
    const cashNum = parseFloat(checkout.cash) || 0;
    if(cashNum < totals.total){ toast('El efectivo recibido es insuficiente'); return; }
  }

  const number = DB.nextSaleNumber();
  const sale = {
    id: 'v' + Date.now(),
    number: number,
    date: new Date().toISOString(),
    items: cart.map(c => {
      const p = findProduct(c.productId);
      return { productId: p.id, name: p.name, price: p.price, qty: c.qty };
    }),
    subtotal: totals.subtotal,
    iva: totals.iva,
    total: totals.total,
    serviceType: checkout.serviceType,
    table: checkout.serviceType === 'comer' ? checkout.table : '',
    paymentMethod: checkout.paymentMethod,
    cash: checkout.paymentMethod === 'efectivo' ? (parseFloat(checkout.cash) || 0) : null,
    change: checkout.paymentMethod === 'efectivo' ? round2((parseFloat(checkout.cash) || 0) - totals.total) : null,
    cancelled: false
  };

  const sales = DB.getSales();
  sales.push(sale);
  DB.saveSales(sales);

  cart = [];
  checkout = { serviceType:'comer', table:'', paymentMethod:'efectivo', cash:'' };
  saleCategoryFilter = 'todos';

  showTicket(sale, { fromCheckout:true });
}

      ${['all','today','week','month'].map(p => `
        <button class="filter-chip ${historyFilters.period===p?'active':''}" onclick="setHistoryFilter('period','${p}')">
          ${ {all:'Todas', today:'Hoy', week:'Esta semana', month:'Este mes'}[p] }
        </button>
      `).join('')}
    </div>
    <div class="filter-row">
      <button class="filter-chip ${historyFilters.status==='all'?'active':''}" onclick="setHistoryFilter('status','all')">Todos los estados</button>
      <button class="filter-chip ${historyFilters.status==='activa'?'active':''}" onclick="setHistoryFilter('status','activa')">Activas</button>

    </div>

    </div>

    <div id="historyList"></div>
  `;

function matchesHistoryFilters(sale){
  const now = new Date();
  const d = new Date(sale.date);
  if(historyFilters.period === 'today' && !isSameDay(d, now)) return false;
  if(historyFilters.period === 'week' && !isSameWeek(d, now)) return false;
  if(historyFilters.period === 'month' && !isSameMonth(d, now)) return false;
  if(historyFilters.status === 'activa' && sale.cancelled) return false;
  if(historyFilters.status === 'cancelada' && !sale.cancelled) return false;
  if(historyFilters.service !== 'all' && sale.serviceType !== historyFilters.service) return false;
  if(historyFilters.payment !== 'all' && sale.paymentMethod !== historyFilters.payment) return false;
  if(historyFilters.search){
    const q = historyFilters.search.toLowerCase();
    const inNumber = String(sale.number).includes(q) || orderNumberLabel(sale.number).toLowerCase().includes(q);
    const inItems = sale.items.some(it => it.name.toLowerCase().includes(q));
    const inTable = (sale.table || '').toLowerCase().includes(q);
    if(!inNumber && !inItems && !inTable) return false;
  }
  return true;
}

function renderHistoryList(){
  const container = document.getElementById('historyList');
  if(!container) return;
  const sales = DB.getSales().slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).filter(matchesHistoryFilters);
  container.innerHTML = sales.length === 0 ? `
    <div class="empty-state">
      <span class="empty-emoji">🔍</span>
      <div class="empty-title">Sin resultados</div>
      <div class="empty-text">No hay ventas que coincidan con estos filtros.</div>
    </div>
  ` : sales.map(s => renderSaleRow(s)).join('');
}

function onHistorySearch(val){ historyFilters.search = val; renderHistoryList(); }
function setHistoryFilter(key, val){
  historyFilters[key] = val;
  render();
}

function openSaleDetail(saleId){
  const sale = DB.getSales().find(s => s.id === saleId);
  if(!sale) return;
  const html = `
    <div class="sheet-header no-print">
      <h2>Detalle de venta</h2>
      <button class="sheet-close" onclick="closeModal()">✕</button>
    </div>
    <div id="ticket-print">${ticketHTML(sale)}</div>
    <div style="display:flex; gap:10px; margin-top:16px;" class="no-print">
      <button class="btn ghost" onclick="window.print()">🖨️ Imprimir</button>
      ${!sale.cancelled ? `<button class="btn danger block" onclick="cancelSale('${sale.id}')">Cancelar venta</button>` : `<button class="btn dark block" onclick="closeModal()">Cerrar</button>`}
    </div>
  `;
  openModal(html, { dismissible:true });
}

function cancelSale(saleId){
  const ok = window.confirm('¿Cancelar esta venta? Se mantendrá en el historial pero dejará de contar en las estadísticas.');
  if(!ok) return;
  const sales = DB.getSales();
  const sale = sales.find(s => s.id === saleId);
  if(!sale) return;
  sale.cancelled = true;
  DB.saveSales(sales);
  toast('Venta cancelada');
  closeModal();
  render();
}

/* =========================================================
   VISTA: VENTAS (dashboard)
========================================================= */
function renderStats(){
  const all = DB.getSales();
  const active = all.filter(s => !s.cancelled);
  const now = new Date();

  const hoy = active.filter(s => isSameDay(new Date(s.date), now));
  const semana = active.filter(s => isSameWeek(new Date(s.date), now));
  const mes = active.filter(s => isSameMonth(new Date(s.date), now));

  const sum = arr => arr.reduce((a,s)=>a+s.total,0);
  const ticketProm = active.length ? sum(active)/active.length : 0;

  if(active.length === 0){
    return `
      <h1 class="page-title">Ventas</h1>
      <p class="page-sub">Estadísticas del negocio</p>
      <div class="empty-state">
        <span class="empty-emoji">📊</span>
        <div class="empty-title">Aún no hay ventas registradas</div>
        <div class="empty-text">Cuando cobres tu primer pedido, verás aquí las estadísticas reales.</div>
      </div>
    `;
  }

  // Por método de pago
  const byPayment = {};
  PAYMENT_METHODS.forEach(p => byPayment[p.id] = { total:0, count:0 });
  active.forEach(s => { byPayment[s.paymentMethod].total += s.total; byPayment[s.paymentMethod].count += 1; });
  const maxPayment = Math.max(1, ...Object.values(byPayment).map(v=>v.total));

  // Por tipo de servicio
  const byService = {};
  SERVICE_TYPES.forEach(s => byService[s.id] = { total:0, count:0 });
  active.forEach(s => { byService[s.serviceType].total += s.total; byService[s.serviceType].count += 1; });
  const maxService = Math.max(1, ...Object.values(byService).map(v=>v.total));

  // Productos más vendidos
  const productMap = {};
  active.forEach(s => s.items.forEach(it => {
    if(!productMap[it.productId]) productMap[it.productId] = { name: it.name, qty:0, revenue:0 };
    productMap[it.productId].qty += it.qty;
    productMap[it.productId].revenue += it.price * it.qty;
  }));
  const topProducts = Object.values(productMap).sort((a,b)=>b.qty-a.qty).slice(0,5);

  return `
    <h1 class="page-title">Ventas</h1>
    <p class="page-sub">Estadísticas calculadas a partir de tus ventas reales</p>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Hoy</div>
        <div class="stat-value">${formatMoney(sum(hoy))}</div>
        <div class="stat-label" style="margin-top:4px;">${hoy.length} pedido${hoy.length===1?'':'s'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Esta semana</div>
        <div class="stat-value">${formatMoney(sum(semana))}</div>
        <div class="stat-label" style="margin-top:4px;">${semana.length} pedido${semana.length===1?'':'s'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Este mes</div>
        <div class="stat-value">${formatMoney(sum(mes))}</div>
        <div class="stat-label" style="margin-top:4px;">${mes.length} pedido${mes.length===1?'':'s'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ticket promedio</div>
        <div class="stat-value">${formatMoney(ticketProm)}</div>
        <div class="stat-label" style="margin-top:4px;">${active.length} pedidos en total</div>
      </div>
    </div>

    <div class="section-title">Ventas por método de pago</div>
    <div class="card">
      ${PAYMENT_METHODS.map(p => {
        const v = byPayment[p.id];
        return `<div class="bar-row">
          <div class="bar-row-top"><span>${p.emoji} ${p.name}</span><span class="bv">${formatMoney(v.total)} · ${v.count}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v.total/maxPayment)*100}%; background:var(--accent);"></div></div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title">Ventas por tipo de servicio</div>
    <div class="card">
      ${SERVICE_TYPES.map(s => {
        const v = byService[s.id];
        return `<div class="bar-row">
          <div class="bar-row-top"><span>${s.emoji} ${s.name}</span><span class="bv">${formatMoney(v.total)} · ${v.count}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v.total/maxService)*100}%; background:var(--nav-bg);"></div></div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title">Productos más vendidos</div>
    <div class="card">
      ${topProducts.map((p,i) => `
        <div class="top-product-row">
          <div class="top-product-rank">${i+1}</div>
          <div class="top-product-name">${escapeHtml(p.name)}<div class="top-product-qty">${p.qty} vendidos</div></div>
          <div class="top-product-rev">${formatMoney(p.revenue)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

/* =========================================================
   VISTA: PRODUCTOS
========================================================= */
function renderProducts(){
  const products = DB.getProducts();
  return `
    <h1 class="page-title">Productos</h1>
    <p class="page-sub">Administra tu catálogo</p>

    <div class="fab-row">
      <button class="btn primary" onclick="openProductForm()">+ Nuevo producto</button>
    </div>

    ${CATEGORIES.map(cat => {
      const items = products.filter(p => p.category === cat.id);
      if(items.length === 0) return '';
      return `
        <div class="cat-header">
          <span class="cat-emoji">${cat.emoji}</span>
          <span class="cat-name">${cat.name}</span>
          <span class="cat-count">· ${items.length}</span>
        </div>
        ${items.map(p => `
          <div class="prod-row">
            <span class="pr-dot" style="background:${cat.color}"></span>
            <div class="pr-info">
              <div class="pr-name">${escapeHtml(p.name)}</div>
              <div class="pr-price">${formatMoney(p.price)}</div>
            </div>
            <label class="switch">
              <input type="checkbox" ${p.active?'checked':''} onchange="toggleProductActive('${p.id}', this.checked)">
              <span class="track"></span>
            </label>
            <button class="icon-btn" onclick="openProductForm('${p.id}')">✎</button>
          </div>
        `).join('')}
      `;
    }).join('')}
  `;
}

function toggleProductActive(id, active){
  const products = DB.getProducts();
  const p = products.find(x => x.id === id);
  if(!p) return;
  p.active = active;
  DB.saveProducts(products);
  toast(active ? 'Producto activado' : 'Producto desactivado');
}

function openProductForm(productId){
  const products = DB.getProducts();
  const editing = productId ? products.find(p => p.id === productId) : null;
  const html = `
    <div class="sheet-header">
      <h2>${editing ? 'Editar producto' : 'Nuevo producto'}</h2>
      <button class="sheet-close" onclick="closeModal()">✕</button>
    </div>
    <div class="field">
      <label>Nombre</label>
      <input id="pfName" type="text" placeholder="Ej. Hamburguesa Especial" value="${editing ? escapeHtml(editing.name) : ''}">
    </div>
    <div class="field">
      <label>Precio</label>
      <input id="pfPrice" type="number" min="0" step="0.5" placeholder="0.00" value="${editing ? editing.price : ''}">
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="pfCategory">
        ${CATEGORIES.map(c => `<option value="${c.id}" ${editing && editing.category===c.id ? 'selected':''}>${c.emoji} ${c.name}</option>`).join('')}
      </select>
    </div>
    <button class="btn primary block" onclick="saveProductForm('${editing ? editing.id : ''}')">${editing ? 'Guardar cambios' : 'Agregar producto'}</button>
  `;
  openModal(html, { dismissible:true });
}

function saveProductForm(productId){
  const name = document.getElementById('pfName').value.trim();
  const price = parseFloat(document.getElementById('pfPrice').value);
  const category = document.getElementById('pfCategory').value;

  if(!name){ toast('Escribe un nombre para el producto'); return; }
  if(isNaN(price) || price < 0){ toast('Ingresa un precio válido'); return; }

  const products = DB.getProducts();
  if(productId){
    const p = products.find(x => x.id === productId);
    p.name = name; p.price = round2(price); p.category = category;
  } else {
    products.push({ id:'p' + Date.now(), name, price: round2(price), category, active:true });
  }
  DB.saveProducts(products);
  closeModal();
  toast(productId ? 'Producto actualizado' : 'Producto agregado');
  render();
}

/* =========================================================
   Reloj + arranque
========================================================= */
function tickClock(){
  const el = document.getElementById('clock');
  if(!el) return;
  const now = new Date();
  el.innerHTML = now.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit' }) + '<br>' +
    now.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
}

initDB();
render();
tickClock();
setInterval(tickClock, 30000);
</script>
</body>
</html>
